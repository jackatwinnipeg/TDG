<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b1020" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>History Records</title>

    <style>
      .grid4 {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }
      @media (max-width: 960px) {
        .grid4 {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 560px) {
        .grid4 {
          grid-template-columns: 1fr;
        }
      }

      .rowCard {
        padding: 12px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(0, 0, 0, 0.14);
        margin-top: 10px;
      }
      .rowTop {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
      }
      .kv {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        opacity: 0.9;
        font-size: 13px;
      }
      .kv span {
        padding: 2px 8px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.04);
      }
      .muted2 {
        opacity: 0.75;
        font-size: 13px;
        margin-top: 6px;
      }

      .pager {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: flex-end;
        margin-top: 12px;
        flex-wrap: wrap;
      }
      .mono {
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", "Courier New", monospace;
      }

      .batch-modal[hidden] {
        display: none !important;
      }
      .batch-modal {
        position: fixed;
        inset: 0;
        z-index: 3000;
        display: grid;
        place-items: center;
        padding: 18px;
        background: rgba(0, 0, 0, 0.72);
        backdrop-filter: blur(8px);
      }
      .batch-dialog {
        width: min(760px, 100%);
        max-height: min(82vh, 760px);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: #111827;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      }
      .batch-dialog-hd,
      .batch-dialog-ft {
        padding: 14px 16px;
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
      }
      .batch-dialog-hd {
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      .batch-dialog-ft {
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }
      .batch-dialog-bd {
        padding: 14px 16px;
        overflow: auto;
      }
      .batch-title {
        font-size: 18px;
        font-weight: 800;
      }
      .batch-summary {
        opacity: 0.78;
        font-size: 13px;
        margin-top: 4px;
      }
      .batch-list {
        display: grid;
        gap: 8px;
      }
      .batch-item {
        display: grid;
        grid-template-columns: 24px 1fr auto;
        gap: 10px;
        align-items: center;
        padding: 11px 12px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.035);
        cursor: pointer;
      }
      .batch-item:hover {
        background: rgba(255, 255, 255, 0.065);
      }
      .batch-item input {
        width: 18px;
        height: 18px;
        margin: 0;
      }
      .batch-item-main {
        min-width: 0;
      }
      .batch-item-name {
        font-weight: 800;
        word-break: break-word;
      }
      .batch-item-sub {
        margin-top: 3px;
        opacity: 0.72;
        font-size: 12px;
        word-break: break-word;
      }
      .batch-count {
        font-size: 12px;
        opacity: 0.8;
        white-space: nowrap;
      }
      .batch-empty {
        padding: 26px 16px;
        text-align: center;
        opacity: 0.76;
        border: 1px dashed rgba(255, 255, 255, 0.16);
        border-radius: 14px;
      }

      .batch-search-panel {
        margin-bottom: 14px;
        padding: 14px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.03);
      }
      .batch-search-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 10px;
      }
      .batch-search-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      .batch-search-stats {
        margin-top: 10px;
        font-size: 13px;
        opacity: 0.8;
      }
      @media (max-width: 1000px) {
        .batch-search-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 600px) {
        .batch-search-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 600px) {
        .batch-modal {
          padding: 0;
          align-items: end;
        }
        .batch-dialog {
          width: 100%;
          max-height: 88vh;
          border-radius: 20px 20px 0 0;
        }
        .batch-item {
          grid-template-columns: 24px 1fr;
        }
        .batch-count {
          grid-column: 2;
        }
        .batch-dialog-ft .btn {
          flex: 1 1 140px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <header>
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
          "
        >
          <div style="display: flex; align-items: center; gap: 12px">
            <h1 style="margin: 0; font-size: 1.5rem">History Records</h1>
            <div class="tag" id="countTag">0 records</div>
          </div>
          <div style="display: flex; gap: 8px; flex-wrap: wrap">
            <button class="btn ok" id="btnBatchFill" type="button">
              Batch Fill Logs
            </button>
            <button class="btn ok" id="btnBatchTDG" type="button">
              Batch TDG Daily Logs
            </button>
            <button class="btn secondary" id="btnBack" type="button">
              ← Back
            </button>
          </div>
        </div>
      </header>

      <main class="layout">
        <section class="card" aria-label="History Filters">
          <div class="hd">
            <div class="tag">Query</div>
          </div>
          <div class="bd">
            <div class="grid4">
              <div>
                <label for="qText">Keyword</label>
                <input
                  id="qText"
                  placeholder="Acc No. / Name / Address / Notes"
                />
              </div>

              <div>
                <label for="qDateFrom">Date From</label>
                <input id="qDateFrom" type="date" />
              </div>

              <div>
                <label for="qDateTo">Date To</label>
                <input id="qDateTo" type="date" />
              </div>

              <div>
                <label for="qWeekCycle">Week Cycle</label>
                <select id="qWeekCycle">
                  <option value="">All</option>
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                  <option value="5">5</option>
                  <option value="6">6</option>
                  <option value="7">7</option>
                  <option value="8">8</option>
                </select>
              </div>
            </div>

            <div class="grid4" style="margin-top: 12px">
              <div>
                <label for="qDriver">Driver Number</label>
                <input id="qDriver" placeholder="D-001 / (auto filled)" />
              </div>
              <div>
                <label for="qVehicle">Vehicle No</label>
                <input id="qVehicle" />
              </div>
              <div>
                <label for="qAccNo">Account Number</label>
                <input id="qAccNo" placeholder="1001" />
              </div>
              <div>
                <label for="qCity">City</label>
                <input id="qCity" placeholder="Winnipeg" />
              </div>
            </div>

            <div
              style="
                display: flex;
                gap: 8px;
                margin-top: 12px;
                flex-wrap: wrap;
                justify-content: flex-end;
              "
            >
              <button class="btn" id="btnReset" type="button">Reset</button>
              <button class="btn ok" id="btnSearch" type="button">
                Search
              </button>
            </div>

            <div class="divider"></div>
          </div>
        </section>

        <aside
          class="card"
          aria-label="History Result"
          id="resultPanel"
          style="display: none"
        >
          <div class="hd">
            <div
              style="
                display: flex;
                justify-content: space-between;
                align-items: center;
              "
            >
              <div class="tag">Result</div>
              <div class="muted mono" id="pageText">—</div>
            </div>
          </div>

          <div class="bd">
            <div id="resultBox"></div>

            <div class="pager">
              <button class="btn secondary" id="btnPrev" type="button">
                Prev
              </button>
              <button class="btn secondary" id="btnNext" type="button">
                Next
              </button>
            </div>
          </div>
        </aside>
      </main>
    </div>


    <div
      class="batch-modal"
      id="batchModal"
      hidden
      aria-hidden="true"
      role="dialog"
      aria-modal="true"
      aria-labelledby="batchModalTitle"
    >
      <div class="batch-dialog">
        <div class="batch-dialog-hd">
          <div>
            <div class="batch-title" id="batchModalTitle">Batch Print</div>
            <div class="batch-summary" id="batchModalSummary"></div>
          </div>
          <button class="btn secondary" id="btnBatchClose" type="button">
            Close
          </button>
        </div>

        <div class="batch-dialog-bd">
          <div class="batch-search-panel" id="batchFillSearchPanel" hidden>
            <div class="batch-search-grid">
              <div>
                <label for="batchFillWeekCycle">Week Cycle</label>
                <select id="batchFillWeekCycle">
                  <option value="">All</option>
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                  <option value="5">5</option>
                  <option value="6">6</option>
                  <option value="7">7</option>
                  <option value="8">8</option>
                </select>
              </div>

              <div>
                <label for="batchFillDriver">Driver Number</label>
                <input
                  id="batchFillDriver"
                  autocomplete="off"
                  placeholder="Driver Number"
                />
              </div>

              <div>
                <label for="batchFillAccount">Account Number</label>
                <input
                  id="batchFillAccount"
                  autocomplete="off"
                  placeholder="Partial match allowed"
                />
              </div>

              <div>
                <label for="batchFillDateFrom">Date From</label>
                <input id="batchFillDateFrom" type="date" />
              </div>

              <div>
                <label for="batchFillDateTo">Date To</label>
                <input id="batchFillDateTo" type="date" />
              </div>
            </div>

            <div class="batch-search-actions">
              <button
                class="btn secondary"
                id="btnBatchFillResetSearch"
                type="button"
              >
                Reset
              </button>
              <button
                class="btn ok"
                id="btnBatchFillSearch"
                type="button"
              >
                Search Fill Logs
              </button>
            </div>

            <div class="batch-search-stats" id="batchFillSearchStats">
              Choose one or more search conditions, then click Search Fill Logs.
            </div>
          </div>

          <div class="batch-search-panel" id="batchTdgSearchPanel" hidden>
            <div
              class="batch-search-grid"
              style="grid-template-columns: repeat(3, minmax(0, 1fr));"
            >
              <div>
                <label for="batchTdgDriver">Driver Number</label>
                <input
                  id="batchTdgDriver"
                  autocomplete="off"
                  placeholder="Driver Number"
                />
              </div>

              <div>
                <label for="batchTdgDateFrom">Date From</label>
                <input id="batchTdgDateFrom" type="date" />
              </div>

              <div>
                <label for="batchTdgDateTo">Date To</label>
                <input id="batchTdgDateTo" type="date" />
              </div>
            </div>

            <div class="batch-search-actions">
              <button
                class="btn secondary"
                id="btnBatchTdgResetSearch"
                type="button"
              >
                Reset
              </button>

              <button
                class="btn ok"
                id="btnBatchTdgSearch"
                type="button"
              >
                Search Daily Logs
              </button>
            </div>

            <div class="batch-search-stats" id="batchTdgSearchStats">
              Choose Driver Number and/or a date range, then click Search Daily Logs.
            </div>
          </div>

          <div class="batch-list" id="batchList"></div>
        </div>

        <div class="batch-dialog-ft">
          <div style="display:flex; gap:8px; flex-wrap:wrap">
            <button class="btn secondary" id="btnBatchSelectAll" type="button">
              Select All
            </button>
            <button class="btn secondary" id="btnBatchClear" type="button">
              Clear
            </button>
          </div>
          <div style="display:flex; gap:8px; flex-wrap:wrap">
            <button class="btn secondary" id="btnBatchCancel" type="button">
              Cancel
            </button>
            <button class="btn ok" id="btnBatchGenerate" type="button">
              Generate / Print
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/supabaseConfig.js"></script>
    <script src="./js/supabaseClient.js"></script>
    <script src="./js/auth_supabase.js"></script>
    <script src="./js/tdg_volume.js"></script>

    <script>
      const $ = (id) => document.getElementById(id);
      const safe = (v) => String(v ?? "").trim();
      const norm = (v) => safe(v).toLowerCase();
      const num = (v) => {
        const n = Number(v);
        return Number.isFinite(n) ? n : 0;
      };

      const LS_HISTORY_VIEW = "tdg_history_view_v1";
      const LS_HISTORY_VIEW_INDEX = "tdg_history_view_index_v1";
      const LS_BATCH_FILL_SELECTION = "tdg_batch_fill_selection_v1";
      const LS_BATCH_TDG_SELECTION = "tdg_batch_tdg_selection_v1";

      let _batchMode = "";
      let _batchEntries = [];
      let _batchTdgFilters = {
        driverNumber: "",
        dateFrom: "",
        dateTo: "",
      };
      let _batchFillFilters = {
        weekCycle: "",
        driverNumber: "",
        accountNumber: "",
        dateFrom: "",
        dateTo: "",
      };

      let _all = [];
      let _filtered = [];
      let _page = 1;
      const PAGE_SIZE = 20;

      function escapeHtml(s) {
        return String(s ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function getLocalDateString() {
        const d = new Date();
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, "0");
        const dd = String(d.getDate()).padStart(2, "0");
        return `${yyyy}-${mm}-${dd}`;
      }

      function getSupabaseClientStrict() {
        const sb = window.supabaseClient;
        if (!sb?.from || !sb?.auth) {
          throw new Error("Supabase client not initialized");
        }
        return sb;
      }

      function mapSupabaseRecord(r) {
        return {
          remoteId: r.id,
          clientRecordId: r.client_record_id || "",
          ownerId: r.owner_id || "",
          driverNumber: r.driver_number || "",
          driverName: r.driver_name || "",
          date: r.work_date || "",
          vehicleNo: r.vehicle_no || "",
          weekCycle: r.week_cycle ?? "",
          shiftStart: r.shift_start || "",
          shiftFinish: r.shift_finish || "",
          arrivalTime: r.arrival_time || "",
          completedAt: r.completed_at || r.created_at || "",
          accountNumber: r.account_number || "",
          accountName: r.account_name || "",
          accountAddress: r.account_address || "",
          accountCity: r.account_city || "",
          accountRoute: r.account_route || "",
          tdgVolume: r.tdg_volume ?? 0,
          deliveredVolume: r.delivered_volume ?? 0,
          notes: r.notes || "",
          synced: true,
          createdAt: r.created_at || "",
          raw: r.raw || null,
        };
      }

      async function loadRecordsFromSupabase() {
        const sb = getSupabaseClientStrict();

        const { data, error } = await sb
          .from("tdg_records")
          .select(`
            id,
            client_record_id,
            owner_id,
            driver_number,
            driver_name,
            work_date,
            vehicle_no,
            week_cycle,
            shift_start,
            shift_finish,
            arrival_time,
            completed_at,
            account_number,
            account_name,
            account_address,
            account_city,
            account_route,
            tdg_volume,
            delivered_volume,
            notes,
            raw,
            created_at
          `)
          .order("created_at", { ascending: false });

        if (error) {
          console.error("loadRecordsFromSupabase error:", error);
          throw error;
        }

        return (data || []).map(mapSupabaseRecord);
      }

      function toDateValue(v) {
        if (!v) return null;
        const d = new Date(v);
        return Number.isNaN(d.getTime()) ? null : d;
      }

      function fmtDateTime(v) {
        const d = toDateValue(v);
        if (!d) return safe(v);
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, "0");
        const dd = String(d.getDate()).padStart(2, "0");
        const hh = String(d.getHours()).padStart(2, "0");
        const mi = String(d.getMinutes()).padStart(2, "0");
        return `${yyyy}-${mm}-${dd} ${hh}:${mi}`;
      }

      function getSortKey(r) {
        return (
          new Date(
            r.completedAt || r.arrivalTime || r.createdAt || r.date || 0
          ).getTime() || 0
        );
      }

      function hideResultPanel() {
        const panel = $("resultPanel");
        if (panel) panel.style.display = "none";
      }

      function showResultPanel() {
        const panel = $("resultPanel");
        if (panel) panel.style.display = "";
      }

      function updateCountTag(count) {
        const el = $("countTag");
        if (el) el.textContent = `${count} records`;
      }

      function resetFiltersToDefault(sess) {
        if ($("qText")) $("qText").value = "";
        if ($("qDateFrom")) $("qDateFrom").value = "";
        if ($("qDateTo")) $("qDateTo").value = "";
        if ($("qWeekCycle")) $("qWeekCycle").value = "";
        if ($("qVehicle")) $("qVehicle").value = "";
        if ($("qAccNo")) $("qAccNo").value = "";
        if ($("qCity")) $("qCity").value = "";

        const dn = safe(sess?.driverNumber || sess?.username || "");
        if ($("qDriver")) $("qDriver").value = dn;
      }

      function applyFilters() {
        const qText = norm($("qText")?.value);
        const qDriver = norm($("qDriver")?.value);
        const qVehicle = norm($("qVehicle")?.value);
        const qAccNo = norm($("qAccNo")?.value);
        const qCity = norm($("qCity")?.value);
        const qWeekCycle = safe($("qWeekCycle")?.value);
        const qDateFrom = safe($("qDateFrom")?.value);
        const qDateTo = safe($("qDateTo")?.value);

        _filtered = _all.filter((r) => {
          if (
            qDriver &&
            !norm(r.driverNumber).includes(qDriver) &&
            !norm(r.driverName).includes(qDriver)
          ) {
            return false;
          }

          if (qVehicle && !norm(r.vehicleNo).includes(qVehicle)) {
            return false;
          }

          if (qAccNo && !norm(r.accountNumber).includes(qAccNo)) {
            return false;
          }

          if (qCity && !norm(r.accountCity).includes(qCity)) {
            return false;
          }

          if (qWeekCycle && safe(r.weekCycle) !== qWeekCycle) {
            return false;
          }

          if (qDateFrom || qDateTo) {
            const d = safe(r.date);
            if (qDateFrom && d < qDateFrom) return false;
            if (qDateTo && d > qDateTo) return false;
          }

          if (qText) {
            const hay = [
              r.accountNumber,
              r.accountName,
              r.accountAddress,
              r.accountCity,
              r.accountRoute,
              r.driverNumber,
              r.driverName,
              r.vehicleNo,
              r.notes,
              r.clientRecordId,
            ]
              .map(norm)
              .join(" | ");

            if (!hay.includes(qText)) return false;
          }

          return true;
        });

        _filtered.sort((a, b) => getSortKey(b) - getSortKey(a));
        _page = 1;
        showResultPanel();
        render();
      }

      function resetFilters() {
        if ($("qText")) $("qText").value = "";
        if ($("qDateFrom")) $("qDateFrom").value = "";
        if ($("qDateTo")) $("qDateTo").value = "";
        if ($("qWeekCycle")) $("qWeekCycle").value = "";
        if ($("qDriver")) $("qDriver").value = "";
        if ($("qVehicle")) $("qVehicle").value = "";
        if ($("qAccNo")) $("qAccNo").value = "";
        if ($("qCity")) $("qCity").value = "";

        _filtered = [];
        _page = 1;

        hideResultPanel();
        updateCountTag(0);
        if ($("pageText")) $("pageText").textContent = "—";
        if ($("resultBox")) $("resultBox").innerHTML = "";
      }

      function openDetail(record) {
        localStorage.setItem(LS_HISTORY_VIEW, JSON.stringify(record));
        localStorage.removeItem(LS_HISTORY_VIEW_INDEX);

        const url = record?.remoteId
          ? `./history_detail.html?id=${encodeURIComponent(record.remoteId)}`
          : "./history_detail.html";

        window.location.href = url;
      }


      function isReloadRecord(record) {
        return !!window.TDG_VOLUME?.isReloadRecord?.(record);
      }

      function isAdjustmentRecord(record) {
        return !!window.TDG_VOLUME?.isAdjustmentRecord?.(record);
      }

      function isNonDeliveryEvent(record) {
        return isReloadRecord(record) || isAdjustmentRecord(record);
      }

      function getCurrentBatchSource() {
        const panel = $("resultPanel");
        const hasSearchResultsOpen =
          panel && panel.style.display !== "none";

        return hasSearchResultsOpen ? _filtered : _all;
      }

      function getBatchFillFilters() {
        return {
          weekCycle: safe($("batchFillWeekCycle")?.value),
          driverNumber: safe($("batchFillDriver")?.value),
          accountNumber: safe($("batchFillAccount")?.value),
          dateFrom: safe($("batchFillDateFrom")?.value),
          dateTo: safe($("batchFillDateTo")?.value),
        };
      }

      function resetBatchFillSearch(sess = null) {
        if ($("batchFillWeekCycle")) $("batchFillWeekCycle").value = "";
        if ($("batchFillAccount")) $("batchFillAccount").value = "";
        if ($("batchFillDateFrom")) $("batchFillDateFrom").value = "";
        if ($("batchFillDateTo")) $("batchFillDateTo").value = "";

        const currentSession =
          sess ||
          window.TDG_AUTH?.getSession?.() ||
          null;

        const driverNumber = safe(
          currentSession?.driverNumber ||
          currentSession?.username ||
          ""
        );

        if ($("batchFillDriver")) {
          $("batchFillDriver").value = driverNumber;
        }

        _batchFillFilters = getBatchFillFilters();
        _batchEntries = [];

        const list = $("batchList");
        if (list) {
          list.innerHTML = `
            <div class="batch-empty">
              Set your Fill Log search range above, then click Search Fill Logs.
            </div>
          `;
        }

        const stats = $("batchFillSearchStats");
        if (stats) {
          stats.textContent =
            "Choose Week Cycle, Driver Number, Account Number and/or any date range.";
        }

        updateBatchSelectionSummary();
      }

      function recordMatchesBatchFillFilters(record, filters) {
        if (isNonDeliveryEvent(record)) return false;

        const accountNumber = safe(record?.accountNumber);
        if (!accountNumber) return false;

        if (
          filters.weekCycle &&
          safe(record?.weekCycle) !== filters.weekCycle
        ) {
          return false;
        }

        if (
          filters.driverNumber &&
          !norm(record?.driverNumber).includes(norm(filters.driverNumber))
        ) {
          return false;
        }

        if (
          filters.accountNumber &&
          !norm(accountNumber).includes(norm(filters.accountNumber))
        ) {
          return false;
        }

        const workDate = safe(record?.date);

        if (filters.dateFrom && (!workDate || workDate < filters.dateFrom)) {
          return false;
        }

        if (filters.dateTo && (!workDate || workDate > filters.dateTo)) {
          return false;
        }

        return true;
      }

      function searchBatchFillLogs() {
        const filters = getBatchFillFilters();

        if (
          filters.dateFrom &&
          filters.dateTo &&
          filters.dateFrom > filters.dateTo
        ) {
          alert("Date From cannot be later than Date To.");
          return;
        }

        _batchFillFilters = filters;

        const matchingRecords = _all.filter((record) =>
          recordMatchesBatchFillFilters(record, filters)
        );

        _batchEntries = buildBatchFillEntries(matchingRecords);
        renderBatchEntries();

        const stats = $("batchFillSearchStats");
        if (stats) {
          const parts = [];

          if (filters.weekCycle) {
            parts.push(`Week ${filters.weekCycle}`);
          }
          if (filters.driverNumber) {
            parts.push(`Driver ${filters.driverNumber}`);
          }
          if (filters.accountNumber) {
            parts.push(`Account contains ${filters.accountNumber}`);
          }
          if (filters.dateFrom || filters.dateTo) {
            parts.push(
              `Date ${filters.dateFrom || "Any"} → ${filters.dateTo || "Any"}`
            );
          }

          stats.textContent =
            `${matchingRecords.length} matching delivery record` +
            `${matchingRecords.length === 1 ? "" : "s"} · ` +
            `${_batchEntries.length} unique account` +
            `${_batchEntries.length === 1 ? "" : "s"}` +
            (parts.length ? ` · ${parts.join(" · ")}` : " · No range restriction");
        }
      }

      function buildBatchFillEntries(records) {
        const map = new Map();

        for (const record of records || []) {
          if (isNonDeliveryEvent(record)) continue;

          const accountNumber = safe(record?.accountNumber);
          if (!accountNumber) continue;

          if (!map.has(accountNumber)) {
            map.set(accountNumber, {
              key: accountNumber,
              accountNumber,
              accountName: safe(record?.accountName),
              accountAddress: safe(record?.accountAddress),
              accountCity: safe(record?.accountCity),
              accountRoute: safe(record?.accountRoute),
              count: 0,
            });
          }

          map.get(accountNumber).count += 1;
        }

        return Array.from(map.values()).sort((a, b) =>
          a.accountNumber.localeCompare(b.accountNumber, undefined, {
            numeric: true,
            sensitivity: "base",
          })
        );
      }

      function getBatchTdgFilters() {
        return {
          driverNumber: safe($("batchTdgDriver")?.value),
          dateFrom: safe($("batchTdgDateFrom")?.value),
          dateTo: safe($("batchTdgDateTo")?.value),
        };
      }

      function resetBatchTdgSearch(sess = null) {
        const currentSession =
          sess ||
          window.TDG_AUTH?.getSession?.() ||
          null;

        const driverNumber = safe(
          currentSession?.driverNumber ||
          currentSession?.username ||
          ""
        );

        if ($("batchTdgDriver")) {
          $("batchTdgDriver").value = driverNumber;
        }

        if ($("batchTdgDateFrom")) {
          $("batchTdgDateFrom").value = "";
        }

        if ($("batchTdgDateTo")) {
          $("batchTdgDateTo").value = "";
        }

        _batchTdgFilters = getBatchTdgFilters();
        _batchEntries = [];

        const list = $("batchList");
        if (list) {
          list.innerHTML = `
            <div class="batch-empty">
              Set Driver Number and/or a date range above, then click Search Daily Logs.
            </div>
          `;
        }

        const stats = $("batchTdgSearchStats");
        if (stats) {
          stats.textContent =
            "Only dates with actual TDG records will be shown. Empty dates are ignored automatically.";
        }

        updateBatchSelectionSummary();
      }

      function recordMatchesBatchTdgFilters(record, filters) {
        const workDate = safe(record?.date);
        if (!workDate) return false;

        if (
          filters.driverNumber &&
          !norm(record?.driverNumber).includes(norm(filters.driverNumber))
        ) {
          return false;
        }

        if (
          filters.dateFrom &&
          workDate < filters.dateFrom
        ) {
          return false;
        }

        if (
          filters.dateTo &&
          workDate > filters.dateTo
        ) {
          return false;
        }

        return true;
      }

      function searchBatchTdgLogs() {
        const filters = getBatchTdgFilters();

        if (
          filters.dateFrom &&
          filters.dateTo &&
          filters.dateFrom > filters.dateTo
        ) {
          alert("Date From cannot be later than Date To.");
          return;
        }

        _batchTdgFilters = filters;

        const matchingRecords = _all.filter((record) =>
          recordMatchesBatchTdgFilters(record, filters)
        );

        _batchEntries = buildBatchTdgEntries(matchingRecords);
        renderBatchEntries();

        const stats = $("batchTdgSearchStats");
        if (stats) {
          const parts = [];

          if (filters.driverNumber) {
            parts.push(`Driver ${filters.driverNumber}`);
          }

          if (filters.dateFrom || filters.dateTo) {
            parts.push(
              `Date ${filters.dateFrom || "Any"} → ${filters.dateTo || "Any"}`
            );
          }

          stats.textContent =
            `${matchingRecords.length} matching record` +
            `${matchingRecords.length === 1 ? "" : "s"} · ` +
            `${_batchEntries.length} Daily Log` +
            `${_batchEntries.length === 1 ? "" : "s"} available` +
            (parts.length ? ` · ${parts.join(" · ")}` : "") +
            " · empty dates ignored";
        }
      }

      function buildBatchTdgEntries(records) {
        const map = new Map();

        for (const record of records || []) {
          const workDate = safe(record?.date);
          if (!workDate) continue;

          const ownerId = safe(record?.ownerId);
          const driverNumber = safe(record?.driverNumber);
          const driverName = safe(record?.driverName);
          const identity = ownerId || driverNumber || driverName || "unknown";
          const key = `${identity}__${workDate}`;

          if (!map.has(key)) {
            map.set(key, {
              key,
              ownerId,
              driverNumber,
              driverName,
              date: workDate,
              count: 0,
              reloadCount: 0,
              adjustmentCount: 0,
            });
          }

          const entry = map.get(key);
          entry.count += 1;
          if (isReloadRecord(record)) {
            entry.reloadCount += 1;
          } else if (isAdjustmentRecord(record)) {
            entry.adjustmentCount += 1;
          }
        }

        return Array.from(map.values()).sort((a, b) => {
          const dateCompare = b.date.localeCompare(a.date);
          if (dateCompare) return dateCompare;
          return (a.driverNumber || a.driverName).localeCompare(
            b.driverNumber || b.driverName,
            undefined,
            { numeric: true, sensitivity: "base" }
          );
        });
      }

      function closeBatchModal() {
        const modal = $("batchModal");
        if (!modal) return;
        modal.hidden = true;
        modal.setAttribute("aria-hidden", "true");
        document.body.style.overflow = "";
        _batchMode = "";
        _batchEntries = [];
      }

      function updateBatchSelectionSummary() {
        const checked = document.querySelectorAll(
          "#batchList input[data-batch-key]:checked"
        ).length;

        const total = _batchEntries.length;
        const label =
          _batchMode === "fill" ? "customers" : "daily logs";

        const summary = $("batchModalSummary");
        if (summary) {
          summary.textContent =
            `${checked} selected · ${total} ${label} available`;
        }

        const generate = $("btnBatchGenerate");
        if (generate) generate.disabled = checked === 0;
      }

      function renderBatchEntries() {
        const list = $("batchList");
        if (!list) return;

        if (!_batchEntries.length) {
          list.innerHTML = `
            <div class="batch-empty">
              No printable records were found in the current query.
            </div>
          `;
          updateBatchSelectionSummary();
          return;
        }

        list.innerHTML = _batchEntries
          .map((entry) => {
            if (_batchMode === "fill") {
              const location = [
                entry.accountAddress,
                entry.accountCity,
                entry.accountRoute,
              ]
                .filter(Boolean)
                .join(" · ");

              return `
                <label class="batch-item">
                  <input
                    type="checkbox"
                    data-batch-key="${escapeHtml(entry.key)}"
                  />
                  <span class="batch-item-main">
                    <span class="batch-item-name">
                      ${escapeHtml(entry.accountNumber)}
                      ·
                      ${escapeHtml(entry.accountName || "Unnamed Account")}
                    </span>
                    <span class="batch-item-sub">
                      ${escapeHtml(location || "No location details")}
                    </span>
                  </span>
                  <span class="batch-count">
                    ${entry.count} record${entry.count === 1 ? "" : "s"}
                  </span>
                </label>
              `;
            }

            const driver =
              entry.driverName ||
              entry.driverNumber ||
              "Unknown Driver";

            const reloadText = entry.reloadCount
              ? ` · ${entry.reloadCount} reload`
              : "";
            const adjustmentText = entry.adjustmentCount
              ? ` · ${entry.adjustmentCount} adjustment`
              : "";

            return `
              <label class="batch-item">
                <input
                  type="checkbox"
                  data-batch-key="${escapeHtml(entry.key)}"
                  checked
                />
                <span class="batch-item-main">
                  <span class="batch-item-name">
                    ${escapeHtml(entry.date)}
                    ·
                    ${escapeHtml(driver)}
                  </span>
                  <span class="batch-item-sub">
                    Driver # ${escapeHtml(entry.driverNumber || "—")}
                    ${escapeHtml(reloadText)}
                    ${escapeHtml(adjustmentText)}
                  </span>
                </span>
                <span class="batch-count">
                  ${entry.count} record${entry.count === 1 ? "" : "s"}
                </span>
              </label>
            `;
          })
          .join("");

        list
          .querySelectorAll("input[data-batch-key]")
          .forEach((input) =>
            input.addEventListener("change", updateBatchSelectionSummary)
          );

        updateBatchSelectionSummary();
      }

      function openBatchModal(mode) {
        _batchMode = mode;

        const title = $("batchModalTitle");
        const fillSearchPanel = $("batchFillSearchPanel");
        const tdgSearchPanel = $("batchTdgSearchPanel");

        if (mode === "fill") {
          if (title) title.textContent = "Batch Fill Logs";
          if (fillSearchPanel) fillSearchPanel.hidden = false;
          if (tdgSearchPanel) tdgSearchPanel.hidden = true;

          resetBatchFillSearch(
            window.TDG_AUTH?.getSession?.() || null
          );
        } else {
          if (title) title.textContent = "Batch TDG Daily Logs";
          if (fillSearchPanel) fillSearchPanel.hidden = true;
          if (tdgSearchPanel) tdgSearchPanel.hidden = false;

          resetBatchTdgSearch(
            window.TDG_AUTH?.getSession?.() || null
          );
        }

        const modal = $("batchModal");
        if (!modal) return;

        modal.hidden = false;
        modal.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
      }

      function setAllBatchCheckboxes(checked) {
        document
          .querySelectorAll("#batchList input[data-batch-key]")
          .forEach((input) => {
            input.checked = checked;
          });

        updateBatchSelectionSummary();
      }

      function generateBatchPrint() {
        const selectedKeys = Array.from(
          document.querySelectorAll(
            "#batchList input[data-batch-key]:checked"
          )
        ).map((input) => input.getAttribute("data-batch-key"));

        if (!selectedKeys.length) {
          alert("Please select at least one item.");
          return;
        }

        const selected = _batchEntries.filter((entry) =>
          selectedKeys.includes(entry.key)
        );

        if (_batchMode === "fill") {
          const payload = {
            createdAt: new Date().toISOString(),
            filters: {
              ..._batchFillFilters,
            },
            accounts: selected.map((entry) => ({
              accountNumber: entry.accountNumber,
              accountName: entry.accountName,
              accountAddress: entry.accountAddress,
              accountCity: entry.accountCity,
              accountRoute: entry.accountRoute,
              matchingRecordCount: entry.count,
            })),
          };

          localStorage.setItem(
            LS_BATCH_FILL_SELECTION,
            JSON.stringify(payload)
          );

          window.open("./batch_fill_log.html", "_blank");
          closeBatchModal();
          return;
        }

        const payload = {
          createdAt: new Date().toISOString(),
          filters: {
            ..._batchTdgFilters,
          },
          groups: selected.map((entry) => ({
            ownerId: entry.ownerId,
            driverNumber: entry.driverNumber,
            driverName: entry.driverName,
            date: entry.date,
          })),
        };

        localStorage.setItem(
          LS_BATCH_TDG_SELECTION,
          JSON.stringify(payload)
        );

        window.open("./batch_tdg_print.html", "_blank");
        closeBatchModal();
      }

      function openDailyLog() {
        const picked =
          $("qDateFrom")?.value ||
          $("qDateTo")?.value ||
          getLocalDateString();

        const date = window.prompt("Enter date (YYYY-MM-DD)", picked);
        if (!date) return;

        const v = String(date).trim();
        if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) {
          alert("Invalid date format. Please use YYYY-MM-DD.");
          return;
        }

        window.open(`./tdg_print.html?date=${encodeURIComponent(v)}`, "_blank");
      }

      function render() {
        const list = _filtered.length ? _filtered : _all;
        const total = list.length;
        const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
        _page = Math.min(Math.max(1, _page), totalPages);

        const start = (_page - 1) * PAGE_SIZE;
        const items = list.slice(start, start + PAGE_SIZE);

        updateCountTag(total);

        const pageText = $("pageText");
        if (pageText) {
          pageText.textContent = total
            ? `Showing ${start + 1}-${Math.min(start + PAGE_SIZE, total)} of ${total} · Page ${_page}/${totalPages}`
            : "No records";
        }

        if ($("btnPrev")) $("btnPrev").disabled = _page === 1;
        if ($("btnNext")) $("btnNext").disabled = _page === totalPages;

        const box = $("resultBox");
        if (!box) return;

        if (!items.length) {
          box.innerHTML = '<div class="muted">No records.</div>';
          return;
        }

        box.innerHTML = items
          .map((r, idx) => {
            const absoluteIndex = start + idx;
            const timeText = fmtDateTime(
              r.completedAt || r.arrivalTime || r.createdAt || r.date
            );
            const volumeText = isReloadRecord(r)
              ? `Reload: +${window.TDG_VOLUME?.getReloadAmountKg?.(r) || 0} kg`
              : isAdjustmentRecord(r)
                ? `TDG Adjustment: -${window.TDG_VOLUME?.getAdjustmentAmountLbs?.(r) || 0} lbs`
                : `Delivered: ${num(r.deliveredVolume)}`;

            return `
              <div class="rowCard">
                <div class="rowTop">
                  <div>
                    <div style="font-weight: 800; font-size: 16px;">
                      ${escapeHtml(safe(r.accountName) || "-")}
                    </div>
                    <div class="muted2">
                      ${escapeHtml(safe(r.accountAddress) || "-")}
                    </div>
                  </div>

                  <div style="display:flex; gap:8px; flex-wrap:wrap;">
                    <button
                      class="btn secondary"
                      type="button"
                      data-act="view"
                      data-idx="${absoluteIndex}"
                    >
                      View Detail
                    </button>
                  </div>
                </div>

                <div class="kv" style="margin-top: 10px;">
                  <span>Time: ${escapeHtml(timeText || "-")}</span>
                  <span>Driver: ${escapeHtml(
                    safe(r.driverName || r.driverNumber) || "-"
                  )}</span>
                  <span>Vehicle: ${escapeHtml(safe(r.vehicleNo) || "-")}</span>
                  <span>Acc No: ${escapeHtml(
                    safe(r.accountNumber) || "-"
                  )}</span>
                  <span>City: ${escapeHtml(safe(r.accountCity) || "-")}</span>
                  <span>Route: ${escapeHtml(safe(r.accountRoute) || "-")}</span>
                  <span>Week: ${escapeHtml(safe(r.weekCycle) || "-")}</span>
                  <span>${escapeHtml(volumeText)}</span>
                </div>

                <div class="muted2">
                  Notes: ${escapeHtml(safe(r.notes) || "-")}
                </div>
              </div>
            `;
          })
          .join("");
      }

      document.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-act='view']");
        if (!btn) return;

        const idx = Number(btn.getAttribute("data-idx"));
        const source = _filtered.length ? _filtered : _all;
        const record = source[idx];
        if (!record) return;

        openDetail(record);
      });

      document.addEventListener("DOMContentLoaded", async () => {
        const sess = window.TDG_AUTH?.requireAuth?.();
        if (!sess) return;

        try {
          _all = await loadRecordsFromSupabase();
          _all.sort((a, b) => getSortKey(b) - getSortKey(a));
          console.log("History records loaded from Supabase:", _all.length);
        } catch (err) {
          console.error("History load failed:", err);
          alert("历史记录读取失败，请检查 Supabase 权限或网络。");
          _all = [];
        }

        resetFiltersToDefault(sess);
        _filtered = [];
        _page = 1;

        hideResultPanel();
        updateCountTag(0);
        if ($("pageText")) $("pageText").textContent = "—";
        if ($("resultBox")) $("resultBox").innerHTML = "";

        $("btnBatchFill")?.addEventListener("click", () => {
          openBatchModal("fill");
        });

        $("btnBatchTDG")?.addEventListener("click", () => {
          openBatchModal("tdg");
        });

        $("btnBatchFillSearch")?.addEventListener(
          "click",
          searchBatchFillLogs
        );

        $("btnBatchFillResetSearch")?.addEventListener(
          "click",
          () => {
            resetBatchFillSearch(sess);
          }
        );

        $("btnBatchTdgSearch")?.addEventListener(
          "click",
          searchBatchTdgLogs
        );

        $("btnBatchTdgResetSearch")?.addEventListener(
          "click",
          () => {
            resetBatchTdgSearch(sess);
          }
        );

        [
          "batchTdgDriver",
          "batchTdgDateFrom",
          "batchTdgDateTo",
        ].forEach((id) => {
          $(id)?.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
              event.preventDefault();
              searchBatchTdgLogs();
            }
          });
        });

        [
          "batchFillWeekCycle",
          "batchFillDriver",
          "batchFillAccount",
          "batchFillDateFrom",
          "batchFillDateTo",
        ].forEach((id) => {
          $(id)?.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
              event.preventDefault();
              searchBatchFillLogs();
            }
          });
        });

        $("btnBatchClose")?.addEventListener("click", closeBatchModal);
        $("btnBatchCancel")?.addEventListener("click", closeBatchModal);

        $("btnBatchSelectAll")?.addEventListener("click", () => {
          setAllBatchCheckboxes(true);
        });

        $("btnBatchClear")?.addEventListener("click", () => {
          setAllBatchCheckboxes(false);
        });

        $("btnBatchGenerate")?.addEventListener(
          "click",
          generateBatchPrint
        );

        $("batchModal")?.addEventListener("click", (event) => {
          if (event.target === $("batchModal")) {
            closeBatchModal();
          }
        });

        document.addEventListener("keydown", (event) => {
          if (
            event.key === "Escape" &&
            !$("batchModal")?.hidden
          ) {
            closeBatchModal();
          }
        });

        $("btnBack")?.addEventListener("click", () => {
          window.location.href = "./index.html";
        });

        $("btnSearch")?.addEventListener("click", applyFilters, {
          passive: true,
        });

        $("btnReset")?.addEventListener(
          "click",
          () => {
            resetFilters();
          },
          { passive: true }
        );

        $("btnPrev")?.addEventListener(
          "click",
          () => {
            _page = Math.max(1, _page - 1);
            render();
          },
          { passive: true }
        );

        $("btnNext")?.addEventListener(
          "click",
          () => {
            const source = _filtered.length ? _filtered : _all;
            const totalPages = Math.max(1, Math.ceil(source.length / PAGE_SIZE));
            _page = Math.min(totalPages, _page + 1);
            render();
          },
          { passive: true }
        );
      });
    </script>
  </body>
</html>
