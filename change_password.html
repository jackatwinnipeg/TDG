<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change password · TDG Route</title><link rel="stylesheet" href="./css/style.css"><script src="./js/tdg_core.js?v=20260912"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"></script><script src="./js/supabaseConfig.js?v=20260912"></script><script src="./js/supabaseClient.js?v=20260912"></script><script src="./js/auth_supabase.js?v=20260912"></script></head><body><main style="max-width:480px;margin:60px auto;padding:24px"><h1>Change password</h1><form id="change"><label>Current password<input id="current" type="password" autocomplete="current-password" required></label><label>New password<input id="next" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><label>Confirm new password<input id="confirm" type="password" autocomplete="new-password" required></label><button id="save">Save</button></form><p id="message" role="status"></p><button id="logout">Sign out</button></main><script>
document.addEventListener('DOMContentLoaded',async()=>{if(!await TDG_AUTH.requireAuthAsync())return;const el=id=>document.getElementById(id);el('logout').onclick=()=>TDG_AUTH.logout();el('change').onsubmit=async e=>{e.preventDefault();if(el('next').value!==el('confirm').value){el('message').textContent='Passwords do not match';return;}el('save').disabled=true;try{const r=await supabaseClient.functions.invoke('tdg-change-password',{body:{currentPassword:el('current').value,newPassword:el('next').value}});if(r.error||!r.data?.ok)throw new Error(r.data?.error||'Password change failed');await TDG_AUTH.logout();}catch(error){el('message').textContent=error.message;}finally{el('save').disabled=false;}};});
</script></body></html>
