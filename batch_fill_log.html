<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Batch CO2 Fill Logs</title>
    <style>
      :root {
        --ink: #111;
        --line: #111;
        --bg: #eceff3;
        --paper: #fff;
        --muted: #666;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 20px;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      @page {
        size: Letter;
        margin: 0.5in;
      }
      .toolbar {
        position: sticky;
        top: 0;
        z-index: 20;
        width: min(8.5in, 100%);
        margin: 0 auto 14px;
        padding: 10px 12px;
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        border: 1px solid #d7dbe0;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 6px 20px rgba(0,0,0,.08);
      }
      .toolbar-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .btn {
        border: 1px solid #111;
        background: #111;
        color: #fff;
        padding: 9px 14px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
      .btn.secondary {
        background: #fff;
        color: #111;
      }
      #status {
        font-size: 13px;
        color: #555;
      }
      #sheets {
        display: grid;
        gap: 18px;
      }
      .sheet {
        width: 8.5in;
        min-height: 10in;
        margin: auto;
        background: var(--paper);
        border: 1.5px solid var(--line);
        padding: 0.35in 0.4in;
        overflow: hidden;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        border-bottom: 2px solid var(--line);
        padding-bottom: 8px;
        margin-bottom: 10px;
      }
      .header h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 700;
      }
      .header-meta {
        font-size: 12px;
        color: var(--muted);
      }
      .profile-box { margin-bottom: 10px; }
      .profile-table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }
      .profile-table td {
        border: 1px solid #111;
        vertical-align: top;
        padding: 2px 4px;
        height: 38px;
      }
      .profile-table .cell-left { width: 81%; }
      .profile-table .cell-right { width: 19%; }
      .cell-label {
        font-size: 12px;
        line-height: 1;
        margin-bottom: 3px;
        text-align: left;
      }
      .cell-input {
        width: 100%;
        border: none;
        outline: none;
        background: transparent;
        font-size: 12px;
        line-height: 1.2;
        padding: 0;
        margin: 0;
        color: #111;
        text-align: center;
        font-weight: 700;
      }
      .section-title {
        font-size: 12px;
        font-weight: 700;
        border-bottom: 1.5px solid var(--line);
        margin: 10px 0 6px;
        padding-bottom: 3px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th, td {
        border: 1px solid var(--line);
        height: 28px;
        padding: 4px 6px;
        font-size: 12px;
        text-align: center;
        vertical-align: middle;
      }
      th {
        background: #f3f3f3;
        font-weight: 700;
      }
      .error-box {
        width: min(8.5in, 100%);
        margin: 20px auto;
        padding: 18px;
        background: #fff;
        border: 1px solid #c33;
        color: #900;
      }
      @media (max-width: 900px) {
        body { padding: 10px; overflow-x: auto; }
        .sheet { transform-origin: top left; }
      }
      @media print {
        body {
          padding: 0;
          background: #fff;
        }
        .no-print { display: none !important; }
        #sheets { display: block; }
        .sheet {
          width: 7.5in;
          height: 10in;
          min-height: 10in;
          margin: 0 auto;
          border: 1.5px solid #111;
          break-after: page;
          page-break-after: always;
          box-shadow: none;
        }
        .sheet:last-child {
          break-after: auto;
          page-break-after: auto;
        }
      }
    </style>
  </head>
  <body>
    <div class="toolbar no-print">
      <div>
        <strong>Batch Fill Logs</strong>
        <div id="status">Loading selected accounts…</div>
      </div>
      <div class="toolbar-actions">
        <button class="btn secondary" id="btnClose" type="button">Close</button>
        <button class="btn" id="btnPrint" type="button" disabled>
          Print / Save PDF
        </button>
      </div>
    </div>

    <main id="sheets"></main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/supabaseConfig.js"></script>
    <script src="./js/supabaseClient.js"></script>
    <script src="./js/auth_supabase.js"></script>
    <script src="./js/tdg_volume.js"></script>
    <script>
      const LS_BATCH_FILL_SELECTION = "tdg_batch_fill_selection_v1";
      const MAX_ROWS = 14;

      const safe = (value) => String(value ?? "").trim();

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function escapeAttr(value) {
        return escapeHtml(value);
      }

      function num(value) {
        const number = Number(value);
        return Number.isFinite(number) ? number : 0;
      }

      function readSelection() {
        try {
          const parsed = JSON.parse(
            localStorage.getItem(LS_BATCH_FILL_SELECTION) || "null"
          );

          if (!parsed || !Array.isArray(parsed.accounts)) {
            return {
              accounts: [],
              filters: {},
            };
          }

          return {
            accounts: parsed.accounts,
            filters:
              parsed.filters && typeof parsed.filters === "object"
                ? parsed.filters
                : {},
          };
        } catch {
          return {
            accounts: [],
            filters: {},
          };
        }
      }

      function recordMatchesSelectionFilters(record, filters) {
        const weekCycle = safe(filters?.weekCycle);
        const driverNumber = safe(filters?.driverNumber).toLowerCase();
        const accountNumber = safe(filters?.accountNumber).toLowerCase();
        const dateFrom = safe(filters?.dateFrom);
        const dateTo = safe(filters?.dateTo);

        if (
          weekCycle &&
          safe(record?.week_cycle) !== weekCycle
        ) {
          return false;
        }

        if (
          driverNumber &&
          !safe(record?.driver_number).toLowerCase().includes(driverNumber)
        ) {
          return false;
        }

        if (
          accountNumber &&
          !safe(record?.account_number).toLowerCase().includes(accountNumber)
        ) {
          return false;
        }

        const workDate = safe(record?.work_date);

        if (dateFrom && (!workDate || workDate < dateFrom)) {
          return false;
        }

        if (dateTo && (!workDate || workDate > dateTo)) {
          return false;
        }

        return true;
      }

      function isReloadRecord(record) {
        return !!window.TDG_VOLUME?.isReloadRecord?.(record);
      }

      function toDateValue(value) {
        if (!value) return null;
        const text = String(value).trim();
        if (!text || /^\d{1,2}:\d{2}$/.test(text)) return null;
        const date = new Date(text);
        return Number.isNaN(date.getTime()) ? null : date;
      }

      function formatDate(value) {
        const text = safe(value);
        if (!text) return "";
        if (/^\d{4}-\d{2}-\d{2}$/.test(text)) return text;

        const date = toDateValue(text);
        if (!date) return "";

        const yyyy = date.getFullYear();
        const mm = String(date.getMonth() + 1).padStart(2, "0");
        const dd = String(date.getDate()).padStart(2, "0");
        return `${yyyy}-${mm}-${dd}`;
      }

      function formatTime(value) {
        const text = safe(value);
        if (!text) return "";

        if (/^\d{1,2}:\d{2}$/.test(text)) {
          const [h, m] = text.split(":");
          return `${String(h).padStart(2, "0")}:${m}`;
        }

        const date = toDateValue(text);
        if (!date) return "";

        return `${String(date.getHours()).padStart(2, "0")}:${String(
          date.getMinutes()
        ).padStart(2, "0")}`;
      }

      function getSortTime(record) {
        const date =
          toDateValue(record?.completed_at) ||
          toDateValue(record?.created_at) ||
          toDateValue(record?.work_date);
        return date ? date.getTime() : 0;
      }

      function displayDate(record) {
        const date =
          formatDate(record?.work_date) ||
          formatDate(record?.completed_at) ||
          formatDate(record?.created_at);

        const time =
          formatTime(record?.arrival_time) ||
          formatTime(record?.completed_at) ||
          formatTime(record?.created_at);

        return date && time ? `${date} ${time}` : date || time || "";
      }

      async function runInChunks(values, worker, chunkSize = 50) {
        const output = [];
        for (let i = 0; i < values.length; i += chunkSize) {
          const chunk = values.slice(i, i + chunkSize);
          const rows = await worker(chunk);
          output.push(...(rows || []));
        }
        return output;
      }

      async function loadCustomers(accountNumbers) {
        if (!accountNumbers.length) return [];

        const sb = window.supabaseClient;
        if (!sb?.from) throw new Error("Supabase client not initialized");

        return runInChunks(accountNumbers, async (chunk) => {
          const { data, error } = await sb
            .from("tdg_customers")
            .select(
              "account_number, account_name, account_address, city, route"
            )
            .in("account_number", chunk);

          if (error) {
            console.warn("Customer metadata query failed:", error);
            return [];
          }

          return data || [];
        });
      }

      async function loadRecords(accountNumbers) {
        if (!accountNumbers.length) return [];

        const sb = window.supabaseClient;
        if (!sb?.from) throw new Error("Supabase client not initialized");

        return runInChunks(accountNumbers, async (chunk) => {
          const { data, error } = await sb
            .from("tdg_records")
            .select(`
              id,
              owner_id,
              driver_number,
              driver_name,
              work_date,
              week_cycle,
              arrival_time,
              completed_at,
              account_number,
              account_name,
              account_address,
              account_city,
              account_route,
              delivered_volume,
              notes,
              raw,
              created_at
            `)
            .in("account_number", chunk)
            .order("created_at", { ascending: false });

          if (error) throw error;
          return data || [];
        });
      }

      function buildSheet(account, records) {
        const latest = records[0] || {};
        const accountName =
          safe(account?.account_name) ||
          safe(latest?.account_name) ||
          safe(account?.accountName);

        const accountNumber =
          safe(account?.account_number) ||
          safe(latest?.account_number) ||
          safe(account?.accountNumber);

        const address =
          [
            safe(account?.account_address) ||
              safe(latest?.account_address) ||
              safe(account?.accountAddress),
            safe(account?.city) ||
              safe(latest?.account_city) ||
              safe(account?.accountCity),
          ]
            .filter(Boolean)
            .join(", ");

        const sortedRows = [...records]
          .sort((a, b) => getSortTime(b) - getSortTime(a))
          .slice(0, MAX_ROWS);

        const bodyRows = [];

        for (const record of sortedRows) {
          bodyRows.push(`
            <tr>
              <td>${escapeHtml(displayDate(record))}</td>
              <td>${escapeHtml(String(num(record?.delivered_volume)))}</td>
              <td>${escapeHtml(safe(record?.notes))}</td>
            </tr>
          `);
        }

        while (bodyRows.length < MAX_ROWS) {
          bodyRows.push("<tr><td></td><td></td><td></td></tr>");
        }

        return `
          <section class="sheet">
            <header class="header">
              <h1>Fill Log CO₂</h1>
              <div class="header-meta">Linde Canada Inc.</div>
            </header>

            <section class="profile-box">
              <table class="profile-table">
                <tr>
                  <td class="cell-left">
                    <div class="cell-label">Account Name：</div>
                    <input
                      class="cell-input"
                      value="${escapeAttr(accountName)}"
                      readonly
                    />
                  </td>
                  <td class="cell-right">
                    <div class="cell-label">Tank Size SF/BD：</div>
                    <input class="cell-input" />
                  </td>
                </tr>
                <tr>
                  <td class="cell-left">
                    <div class="cell-label">Address：</div>
                    <input
                      class="cell-input"
                      value="${escapeAttr(address)}"
                      readonly
                    />
                  </td>
                  <td class="cell-right">
                    <div class="cell-label">Account Number：</div>
                    <input
                      class="cell-input"
                      value="${escapeAttr(accountNumber)}"
                      readonly
                    />
                  </td>
                </tr>
                <tr>
                  <td class="cell-left">
                    <div class="cell-label">Fill box location:</div>
                    <input class="cell-input" />
                  </td>
                  <td class="cell-right">
                    <div class="cell-label">Gas Part Number:</div>
                    <input class="cell-input" value="CD BEVBULK" />
                  </td>
                </tr>
              </table>
            </section>

            <div class="section-title">Fill Log Records</div>
            <table>
              <thead>
                <tr>
                  <th style="width:25%">Date/Time</th>
                  <th style="width:25%">Amount</th>
                  <th style="width:50%">Notes</th>
                </tr>
              </thead>
              <tbody>${bodyRows.join("")}</tbody>
            </table>
          </section>
        `;
      }

      async function init() {
        const sess = window.TDG_AUTH?.requireAuth?.();
        if (!sess) return;

        const selection = readSelection();
        const selected = selection.accounts;
        const filters = selection.filters || {};

        const accountNumbers = [
          ...new Set(
            selected
              .map((entry) => safe(entry?.accountNumber))
              .filter(Boolean)
          ),
        ];

        if (!accountNumbers.length) {
          document.getElementById("status").textContent =
            "No accounts selected.";
          document.getElementById("sheets").innerHTML =
            '<div class="error-box">No batch Fill Log selection was found. Return to History Records and choose Batch Fill Logs again.</div>';
          return;
        }

        try {
          const [customers, allRecords] = await Promise.all([
            loadCustomers(accountNumbers),
            loadRecords(accountNumbers),
          ]);

          const customerMap = new Map(
            customers.map((row) => [safe(row.account_number), row])
          );

          const recordMap = new Map();

          /*
           * IMPORTANT:
           * Batch search filters are used only to decide WHICH ACCOUNTS
           * appear in the selection list.
           *
           * Once an account is selected, its Fill Log must use that
           * customer's complete delivery history (excluding Reload events),
           * then buildSheet() keeps the most recent MAX_ROWS records.
           */
          for (const row of allRecords) {
            if (isReloadRecord(row)) continue;

            const accountNumber = safe(row.account_number);
            if (!recordMap.has(accountNumber)) {
              recordMap.set(accountNumber, []);
            }

            recordMap.get(accountNumber).push(row);
          }

          const sheets = [];

          for (const selectedAccount of selected) {
            const accountNumber = safe(selectedAccount?.accountNumber);
            if (!accountNumber) continue;

            const records = recordMap.get(accountNumber) || [];
            if (!records.length) continue;

            const customer =
              customerMap.get(accountNumber) || selectedAccount;

            sheets.push(buildSheet(customer, records));
          }

          if (!sheets.length) {
            document.getElementById("status").textContent =
              "No printable Fill Logs found.";
            document.getElementById("sheets").innerHTML =
              '<div class="error-box">The selected accounts no longer have printable delivery records.</div>';
            return;
          }

          document.getElementById("sheets").innerHTML = sheets.join("");
          document.getElementById("status").textContent =
            `${sheets.length} Fill Log${sheets.length === 1 ? "" : "s"} ready · ` +
            `Each log shows the customer's most recent ${MAX_ROWS} delivery records`;
          document.getElementById("btnPrint").disabled = false;
          document.title = `Batch Fill Logs (${sheets.length})`;
        } catch (error) {
          console.error("Batch Fill Log load failed:", error);
          document.getElementById("status").textContent = "Load failed";
          document.getElementById("sheets").innerHTML =
            `<div class="error-box">Failed to load Fill Logs: ${escapeHtml(
              error?.message || error
            )}</div>`;
        }
      }

      document.getElementById("btnPrint").addEventListener("click", () => {
        window.print();
      });

      document.getElementById("btnClose").addEventListener("click", () => {
        window.close();
      });

      document.addEventListener("DOMContentLoaded", init);
    </script>
  </body>
</html>
